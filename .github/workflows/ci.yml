name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', '1.22', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -short -count=1
        if: matrix.go != 'stable'
      - run: go test ./... -count=1
        if: matrix.go == 'stable'
      - run: go test ./... -race -count=1
        if: matrix.go == 'stable'
      - name: gofmt
        run: test -z "$(gofmt -l .)"
